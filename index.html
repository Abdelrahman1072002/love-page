<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A question?!!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="content-box">
            
            <!-- محتوى السؤال -->
            <div id="question-content">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&auto=format&fit=crop&q=60" alt="صورة السؤال">
                <h2>Do you love me?</h2>
                <div class="buttons">
                    <button id="yes-btn" class="yes-btn" onclick="sayYes()">Yes</button>
                    <button id="no-btn" class="no-btn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">No</button>
                </div>
            </div>

            <!-- محتوى النتيجة (عند الضغط على Yes) -->
            <div id="result-content" style="display: none;">
                <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500&auto=format&fit=crop&q=60" alt="صورة النتيجة">
                <h2>I knew it! 😍</h2>
                <h2>Me to 😘🙈❤️❤️</h2>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
